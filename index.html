<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Letters Helper</title>
    <script src="main.js" defer></script>
</head>
<body>
    <form>
        <div>Золотые буквы</div>
        <div class="golden-letters">
            <label for="1-gold">1</label>
            <input type="text" maxlength="1" name="1-gold" id="1-gold" size="1" >
            <label for="2-gold">2</label>
            <input type="text" maxlength="1" name="2-gold" id="2-gold" size="1" >
            <label for="3-gold">3</label>
            <input type="text" maxlength="1" name="3-gold" id="3-gold" size="1" >
            <label for="4-gold">4</label>
            <input type="text" maxlength="1" name="4-gold" id="4-gold" size="1" >
            <label for="5-gold">5</label>
            <input type="text" maxlength="1" name="5-gold" id="5-gold" size="1" >
        </div>
        <div>Белые буквы</div>
        <div class="white-letters">
            <label for="1-white">1</label>
            <input type="text" maxlength="6" name="1-white" id="1-white" size="6" >
            <label for="2-white">2</label>
            <input type="text" maxlength="6" name="2-white" id="2-white" size="6" >
            <label for="3-white">3</label>
            <input type="text" maxlength="6" name="3-white" id="3-white" size="6" >
            <label for="4-white">4</label>
            <input type="text" maxlength="6" name="4-white" id="4-white" size="6" >
            <label for="5-white">5</label>
            <input type="text" maxlength="6" name="5-white" id="5-white" size="6" >
        </div>
        <div>Серые буквы</div>
        <div class="gray-letters">        
            <label for="gray-array">Ввести список серых букв подряд без пробелов</label>
            <input type="text" maxlength="33" name="gray-array" size="33" id="gray-array">
        </div>
        <input type="submit" value="Найти слова" id="find-the-words">
    </form>
    <div id="output-place" class="output-place">
        test
    </div>

</body>
</html>
